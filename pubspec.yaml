name: blue_mesh
description: "Decentralized peer-to-peer Bluetooth Low Energy mesh chat app for mobile and desktop."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # BLE Core & Cross-Platform Central
  flutter_blue_plus: ^1.32.0

  # BLE Peripheral (GATT Server + Advertising for Android/iOS)
  flutter_ble_peripheral: ^1.2.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Background Services & Notifications
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.2
  sqlite3: ^2.4.1
  path_provider: ^2.1.2
  path: ^1.9.0

  # Cryptography (ECDH, ECDSA, AES-GCM, HKDF) & Secure Storage
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.0.0

  # Permissions & Device Info
  permission_handler: ^11.3.0

  # Navigation & Routing
  go_router: ^14.0.0

  # Utilities
  uuid: ^4.4.0
  logger: ^2.2.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
